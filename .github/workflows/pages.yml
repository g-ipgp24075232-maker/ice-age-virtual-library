name: Deploy Ice Age Virtual Library with self-hosted MediaPipe
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build self-contained site and install official MediaPipe assets
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/mediapipe-deps" --no-audit --no-fund --no-save --no-package-lock @mediapipe/tasks-vision@0.10.35
          PKG="$RUNNER_TEMP/mediapipe-deps/node_modules/@mediapipe/tasks-vision"
          test -s "$PKG/vision_bundle.mjs"
          test -d "$PKG/wasm"
          mkdir -p site/vendor/mediapipe/models
          cp index.html gesture.js flipbook.js soundscape.js references.js storybook-world.js storybook-theme.css site-config.js site-editor-ui.js site-editor.css published-content.json book-audio.js site/
          cp -R audio site/audio
          cp -R art site/art
          cp "$PKG/vision_bundle.mjs" site/vendor/mediapipe/vision_bundle.mjs
          cp -R "$PKG/wasm" site/vendor/mediapipe/
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 25 --max-time 180 \
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" \
            --output site/vendor/mediapipe/models/hand_landmarker.task
          test -s site/vendor/mediapipe/models/hand_landmarker.task
          test -s site/vendor/mediapipe/vision_bundle.mjs
          test -s site/vendor/mediapipe/wasm/vision_wasm_internal.wasm
          node --check gesture.js
          node --check flipbook.js
          node --check soundscape.js
          node --check references.js
          node --check storybook-world.js
          node --check site-config.js
          node --check site-editor-ui.js
          node --check book-audio.js
          test -s site/book-audio.js
          test -d site/audio
          python3 -m json.tool published-content.json > /dev/null
          test -s site/site-editor.css
          test -s site/storybook-theme.css
          test -s site/art/ice-age-landscape.svg
          test -s site/art/ice-cave-library.svg
          test -s site/art/baby-mammoth.svg
          test -s site/art/snow-owl.svg
          test -s site/art/story-mammoth.svg
          test -s site/art/story-sabertooth.svg
          node --check site/vendor/mediapipe/vision_bundle.mjs
          echo "Self-hosted MediaPipe assets and model validated."
          du -h site/vendor/mediapipe/vision_bundle.mjs site/vendor/mediapipe/models/hand_landmarker.task
          ls -la site/vendor/mediapipe/wasm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
