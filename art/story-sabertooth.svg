<defs>
<linearGradient id="coat" x2=".7" y2="1"><stop stop-color="#f7b357"/><stop offset=".46" stop-color="#db7f35"/><stop offset="1" stop-color="#a34f27"/></linearGradient>
<linearGradient id="face" x2="1" y2="1"><stop stop-color="#ffd08a"/><stop offset=".48" stop-color="#dc8640"/><stop offset="1" stop-color="#b9672f"/></linearGradient>
<linearGradient id="cream" x2=".8" y2="1"><stop stop-color="#fff5d4"/><stop offset="1" stop-color="#e6c792"/></linearGradient>
<style>
.body{transform-box:fill-box;transform-origin:52% 89%;animation:catBreath 3.9s ease-in-out infinite}
.tail{transform-box:fill-box;transform-origin:4% 45%;animation:tailWag 2.7s ease-in-out infinite}
.head{transform-box:fill-box;transform-origin:85% 65%;animation:headTilt 5.6s ease-in-out infinite}
.ear{transform-box:fill-box;transform-origin:50% 70%;animation:earTwitch 6s ease-in-out infinite}
.eyelid{opacity:0;animation:blinkCat 5s step-end infinite}
@keyframes catBreath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.014)}}
@keyframes tailWag{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(11deg)}}
@keyframes headTilt{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(2deg)}}
@keyframes blinkCat{0%,51%,56%,100%{opacity:0}52%,54%{opacity:1}}
@keyframes earTwitch{0%,92%,100%{transform:rotate(0deg)}95%{transform:rotate(8deg)}}
@media(prefers-reduced-motion:reduce){.body,.tail,.head,.ear,.eyelid{animation:none!important}}
</style>
</defs>
