<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" role="img" aria-label="Mamot berbulu coklat dengan gading besar, ilustrasi kartun 2D bergerak">
<defs>
<linearGradient id="coat" x2=".55" y2="1"><stop stop-color="#aa714d"/><stop offset=".38" stop-color="#895433"/><stop offset="1" stop-color="#63391e"/></linearGradient>
<linearGradient id="head" x2="1" y2="1"><stop stop-color="#c18a5e"/><stop offset=".62" stop-color="#955a38"/><stop offset="1" stop-color="#784527"/></linearGradient>
<linearGradient id="ivory" x2=".7" y2="1"><stop stop-color="#fff8dd"/><stop offset=".52" stop-color="#f4dc9f"/><stop offset="1" stop-color="#cfb57f"/></linearGradient>
<linearGradient id="ear" x2="0" y2="1"><stop stop-color="#9d6d57"/><stop offset="1" stop-color="#6a473c"/></linearGradient>
<style>
.body{transform-box:fill-box;transform-origin:50% 92%;animation:mammothBreath 4.6s ease-in-out infinite}
.trunk{transform-box:fill-box;transform-origin:45% 4%;animation:trunkSwing 4.2s ease-in-out infinite}
.tail{transform-box:fill-box;transform-origin:15% 12%;animation:tailWag 3.5s ease-in-out infinite}
.ear{transform-box:fill-box;transform-origin:70% 45%;animation:earWiggle 6.4s ease-in-out infinite}
.eyelid{transform-box:fill-box;transform-origin:50% 0%;animation:blinkMammoth 6.4s step-end infinite;opacity:0}
@keyframes mammothBreath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
@keyframes trunkSwing{0%,100%{transform:rotate(-2deg)}45%{transform:rotate(4deg)}72%{transform:rotate(-1deg)}}
@keyframes tailWag{0%,100%{transform:rotate(0deg)}50%{transform:rotate(10deg)}}
@keyframes earWiggle{0%,93%,100%{transform:rotate(0deg)}96%{transform:rotate(9deg)}}
@keyframes blinkMammoth{0%,46%,50%,100%{opacity:0}47%,48%{opacity:1}}
@media(prefers-reduced-motion:reduce){.body,.trunk,.tail,.ear,.eyelid{animation:none!important}}
</style>
</defs>
